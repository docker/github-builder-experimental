name: setup-registry-identities

on:
  workflow_call:
    inputs:
      registry-identities:
        type: string
        description: "Keyless registry identity configuration as YAML objects"
        required: false
      registry-login:
        type: boolean
        description: "Whether registry login is enabled"
        required: false
        default: true
    outputs:
      aws-ecr-enabled:
        description: "Whether an AWS ECR registry identity was configured"
        value: ${{ jobs.setup-registry-identities.outputs.aws-ecr-enabled }}
      aws-ecr-registry:
        description: "AWS ECR registry host to authenticate against"
        value: ${{ jobs.setup-registry-identities.outputs.aws-ecr-registry }}
      aws-ecr-role-to-assume:
        description: "AWS IAM role ARN to assume for ECR authentication"
        value: ${{ jobs.setup-registry-identities.outputs.aws-ecr-role-to-assume }}
      aws-ecr-region:
        description: "AWS region to use for ECR authentication"
        value: ${{ jobs.setup-registry-identities.outputs.aws-ecr-region }}
      gcp-wif-enabled:
        description: "Whether a GCP Workload Identity Federation registry identity was configured"
        value: ${{ jobs.setup-registry-identities.outputs.gcp-wif-enabled }}
      gcp-wif-registry:
        description: "Google Artifact Registry host to authenticate against"
        value: ${{ jobs.setup-registry-identities.outputs.gcp-wif-registry }}
      gcp-wif-workload-identity-provider:
        description: "GCP Workload Identity Provider resource name"
        value: ${{ jobs.setup-registry-identities.outputs.gcp-wif-workload-identity-provider }}
      gcp-wif-service-account:
        description: "GCP service account to impersonate"
        value: ${{ jobs.setup-registry-identities.outputs.gcp-wif-service-account }}
      gcp-wif-project-id:
        description: "GCP project ID"
        value: ${{ jobs.setup-registry-identities.outputs.gcp-wif-project-id }}
      dockerhub-oidc-enabled:
        description: "Whether a Docker Hub OIDC registry identity was configured"
        value: ${{ jobs.setup-registry-identities.outputs.dockerhub-oidc-enabled }}
      dockerhub-oidc-registry:
        description: "Docker Hub registry hostname"
        value: ${{ jobs.setup-registry-identities.outputs.dockerhub-oidc-registry }}
      dockerhub-oidc-username:
        description: "Docker Hub username or organization to authenticate as"
        value: ${{ jobs.setup-registry-identities.outputs.dockerhub-oidc-username }}
      dockerhub-oidc-connection-id:
        description: "Docker Hub OIDC connection ID"
        value: ${{ jobs.setup-registry-identities.outputs.dockerhub-oidc-connection-id }}

env:
  RUNTIME_MODULE: "@docker/github-builder-runtime@0.98.0"
  RUNTIME_INSTALL_ARGS: |
    --loglevel=error
    --no-save
    --package-lock=false
    --ignore-scripts
    --omit=dev
    --prefer-offline
    --fund=false
    --audit=false
  NPM_CONFIG_FETCH_RETRIES: "5"

jobs:
  setup-registry-identities:
    runs-on: ubuntu-24.04
    outputs:
      aws-ecr-enabled: ${{ steps.validate.outputs.aws-ecr-enabled }}
      aws-ecr-registry: ${{ steps.validate.outputs.aws-ecr-registry }}
      aws-ecr-role-to-assume: ${{ steps.validate.outputs.aws-ecr-role-to-assume }}
      aws-ecr-region: ${{ steps.validate.outputs.aws-ecr-region }}
      gcp-wif-enabled: ${{ steps.validate.outputs.gcp-wif-enabled }}
      gcp-wif-registry: ${{ steps.validate.outputs.gcp-wif-registry }}
      gcp-wif-workload-identity-provider: ${{ steps.validate.outputs.gcp-wif-workload-identity-provider }}
      gcp-wif-service-account: ${{ steps.validate.outputs.gcp-wif-service-account }}
      gcp-wif-project-id: ${{ steps.validate.outputs.gcp-wif-project-id }}
      dockerhub-oidc-enabled: ${{ steps.validate.outputs.dockerhub-oidc-enabled }}
      dockerhub-oidc-registry: ${{ steps.validate.outputs.dockerhub-oidc-registry }}
      dockerhub-oidc-username: ${{ steps.validate.outputs.dockerhub-oidc-username }}
      dockerhub-oidc-connection-id: ${{ steps.validate.outputs.dockerhub-oidc-connection-id }}
    steps:
      -
        name: Install dependencies
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_RUNTIME-MODULE: ${{ env.RUNTIME_MODULE }}
          INPUT_RUNTIME-INSTALL-ARGS: ${{ env.RUNTIME_INSTALL_ARGS }}
          INPUT_REGISTRY-IDENTITIES: ${{ inputs.registry-identities }}
          INPUT_REGISTRY-LOGIN: ${{ inputs.registry-login }}
        with:
          script: |
            const registryLogin = core.getBooleanInput('registry-login');
            if (!registryLogin) {
              core.info('Registry authentication not required; skipping npm install');
              return;
            }

            const registryIdentities = core.getInput('registry-identities', {trimWhitespace: false});
            if (!registryIdentities.trim()) {
              core.info('No registry identities configured; skipping npm install');
              return;
            }

            core.info('Registry identities configured; installing validation dependencies');
            const npmArgs = ['install', ...core.getMultilineInput('runtime-install-args'), core.getInput('runtime-module')];
            const maxAttempts = 3;
            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              const exitCode = await exec.exec('npm', npmArgs, {ignoreReturnCode: true});
              if (exitCode === 0) {
                return;
              }
              if (attempt === maxAttempts) {
                core.setFailed(`npm install failed after ${maxAttempts} attempts`);
                return;
              }
              const retryDelayMs = attempt * 50;
              core.info(`npm install failed with exit code ${exitCode}; retrying in ${retryDelayMs}ms`);
              await new Promise(resolve => setTimeout(resolve, retryDelayMs));
            }
      -
        name: Validate registry identities
        id: validate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_REGISTRY-IDENTITIES: ${{ inputs.registry-identities }}
          INPUT_REGISTRY-LOGIN: ${{ inputs.registry-login }}
        with:
          script: |
            const setEmptyOutputs = () => {
              core.setOutput('aws-ecr-enabled', 'false');
              core.setOutput('aws-ecr-registry', '');
              core.setOutput('aws-ecr-role-to-assume', '');
              core.setOutput('aws-ecr-region', '');
              core.setOutput('gcp-wif-enabled', 'false');
              core.setOutput('gcp-wif-registry', '');
              core.setOutput('gcp-wif-workload-identity-provider', '');
              core.setOutput('gcp-wif-service-account', '');
              core.setOutput('gcp-wif-project-id', '');
              core.setOutput('dockerhub-oidc-enabled', 'false');
              core.setOutput('dockerhub-oidc-registry', '');
              core.setOutput('dockerhub-oidc-username', '');
              core.setOutput('dockerhub-oidc-connection-id', '');
            };

            const registryLogin = core.getBooleanInput('registry-login');
            if (!registryLogin) {
              core.info('Registry authentication not required; skipping validation');
              setEmptyOutputs();
              return;
            }

            const registryIdentities = core.getInput('registry-identities', {trimWhitespace: false});
            if (!registryIdentities.trim()) {
              core.info('No registry identities configured; skipping validation');
              setEmptyOutputs();
              return;
            }

            let yaml;
            try {
              yaml = require('js-yaml');
            } catch {
              yaml = require('@docker/github-builder-runtime/node_modules/js-yaml');
            }

            const fail = message => {
              throw new Error(`Invalid registry-identities input: ${message}`);
            };

            const ensureObject = (value, path) => {
              if (!value || typeof value !== 'object' || Array.isArray(value)) {
                fail(`${path} must be an object`);
              }
            };

            const requireString = (entry, key, path) => {
              const value = entry[key];
              if (typeof value !== 'string' || !value.trim()) {
                fail(`${path}.${key} must be a non-empty string`);
              }
              return value.trim();
            };

            const optionalString = (entry, key, path, defaultValue) => {
              if (!Object.prototype.hasOwnProperty.call(entry, key)) {
                return defaultValue;
              }
              return requireString(entry, key, path);
            };

            try {
              let parsed;
              try {
                parsed = yaml.load(registryIdentities);
              } catch (error) {
                fail(error.message);
              }
              if (parsed === null || parsed === undefined) {
                core.info('Registry identities input is empty after parsing; disabling registry identity outputs');
                setEmptyOutputs();
                return;
              }

              const entries = Array.isArray(parsed) ? parsed : [parsed];
              if (entries.length === 0) {
                core.info('No registry identity entries parsed; disabling registry identity outputs');
                setEmptyOutputs();
                return;
              }
              core.info(`Validating ${entries.length} registry identity ${entries.length === 1 ? 'entry' : 'entries'}`);

              let awsEcr;
              let gcpWif;
              let dockerhubOidc;
              entries.forEach((entry, index) => {
                const path = `registry-identities[${index}]`;
                ensureObject(entry, path);
                const type = requireString(entry, 'type', path);
                switch (type) {
                  case 'aws-ecr': {
                    const allowedKeys = new Set(['type', 'registry', 'role-to-assume', 'region']);
                    for (const key of Object.keys(entry)) {
                      if (!allowedKeys.has(key)) {
                        fail(`${path}.${key} is not supported for aws-ecr`);
                      }
                    }
                    if (awsEcr) {
                      fail('only one aws-ecr registry identity is supported');
                    }
                    awsEcr = {
                      registry: requireString(entry, 'registry', path),
                      roleToAssume: requireString(entry, 'role-to-assume', path),
                      region: requireString(entry, 'region', path)
                    };
                    core.info(`Configured aws-ecr registry identity for ${awsEcr.registry}`);
                    break;
                  }
                  case 'gcp-wif': {
                    const allowedKeys = new Set(['type', 'registry', 'workload_identity_provider', 'service_account', 'project_id']);
                    for (const key of Object.keys(entry)) {
                      if (!allowedKeys.has(key)) {
                        fail(`${path}.${key} is not supported for gcp-wif`);
                      }
                    }
                    if (gcpWif) {
                      fail('only one gcp-wif registry identity is supported');
                    }
                    gcpWif = {
                      registry: requireString(entry, 'registry', path),
                      workloadIdentityProvider: requireString(entry, 'workload_identity_provider', path),
                      serviceAccount: requireString(entry, 'service_account', path),
                      projectId: optionalString(entry, 'project_id', path, '')
                    };
                    core.info(`Configured gcp-wif registry identity for ${gcpWif.registry}`);
                    break;
                  }
                  case 'dockerhub': {
                    const allowedKeys = new Set(['type', 'registry', 'username', 'connection_id']);
                    for (const key of Object.keys(entry)) {
                      if (!allowedKeys.has(key)) {
                        fail(`${path}.${key} is not supported for dockerhub`);
                      }
                    }
                    if (dockerhubOidc) {
                      fail('only one dockerhub registry identity is supported');
                    }
                    dockerhubOidc = {
                      registry: optionalString(entry, 'registry', path, 'docker.io'),
                      username: requireString(entry, 'username', path),
                      connectionID: requireString(entry, 'connection_id', path)
                    };
                    core.info(`Configured dockerhub registry identity for ${dockerhubOidc.registry}`);
                    break;
                  }
                  default:
                    fail(`${path}.type has unsupported provider ${type}`);
                }
              });

              core.setOutput('aws-ecr-enabled', awsEcr ? 'true' : 'false');
              core.setOutput('aws-ecr-registry', awsEcr?.registry || '');
              core.setOutput('aws-ecr-role-to-assume', awsEcr?.roleToAssume || '');
              core.setOutput('aws-ecr-region', awsEcr?.region || '');
              core.setOutput('gcp-wif-enabled', gcpWif ? 'true' : 'false');
              core.setOutput('gcp-wif-registry', gcpWif?.registry || '');
              core.setOutput('gcp-wif-workload-identity-provider', gcpWif?.workloadIdentityProvider || '');
              core.setOutput('gcp-wif-service-account', gcpWif?.serviceAccount || '');
              core.setOutput('gcp-wif-project-id', gcpWif?.projectId || '');
              core.setOutput('dockerhub-oidc-enabled', dockerhubOidc ? 'true' : 'false');
              core.setOutput('dockerhub-oidc-registry', dockerhubOidc?.registry || '');
              core.setOutput('dockerhub-oidc-username', dockerhubOidc?.username || '');
              core.setOutput('dockerhub-oidc-connection-id', dockerhubOidc?.connectionID || '');
            } catch (error) {
              core.setFailed(error.message || error);
            }
